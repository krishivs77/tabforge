[project]
name = "tabforge"
version = "0.1.0"
description = "Vocal melody to playable guitar tabs."
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12.0",
]

[project.scripts]
tabforge = "tabforge.cli:app"

[tool.pytest.ini_options]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
